<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | OSG myG PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex !important; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-app); overflow: hidden; }
        .login-container { width: 100%; max-width: 420px; padding: 2rem; position: relative; z-index: 10; }
        .login-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px; padding: 3rem 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.2) inset; text-align: center; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .brand-icon-large { width: 64px; height: 64px; background: var(--primary-gradient); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; margin: 0 auto 1.5rem auto; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4); transform: rotate(-5deg); }
        .login-title { font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.5px; }
        .login-subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2.5rem; }
        .form-group { text-align: left; margin-bottom: 1.25rem; position: relative; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem; padding-left: 4px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 1.1rem; pointer-events: none; transition: color 0.2s; }
        .form-control { width: 100%; padding: 0.85rem 1rem 0.85rem 2.75rem; background: rgba(255, 255, 255, 0.6); border: 1px solid var(--border-light); border-radius: 12px; font-size: 1rem; color: var(--text-main); transition: all 0.2s; font-family: var(--font-main); }
        .form-control:focus { outline: none; background: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .form-control:focus+i { color: var(--primary); }
        .btn-login { display: block; width: 100%; padding: 0.85rem; background: var(--primary-gradient); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1.5rem; margin-bottom: 1.5rem; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.4); }
        .alert-error { background: #fef2f2; border: 1px solid #fee2e2; color: #ef4444; padding: 0.75rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both; }
        .alert-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 0.75rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .btn-link { display: inline-block; margin-top: 10px; color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-1"></div><div class="globe globe-2"></div><div class="globe globe-3"></div>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-icon-large"><i class="ri-lock-password-fill"></i></div>
            <h1 class="login-title">Reset Password</h1>
            <p class="login-subtitle">Enter your username to receive a reset link</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert-{{ category }}">
                            <i class="ri-information-fill"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                        <i class="ri-user-line"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login">Send Reset Link</button>
            </form>
            <a href="{{ url_for('login') }}" class="btn-link"><i class="ri-arrow-left-line"></i> Back to Login</a>
        </div>
    </div>
</body>
</html>
